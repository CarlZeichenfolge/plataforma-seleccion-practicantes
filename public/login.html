<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingreso de analistas · Selección de Practicantes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/tema.js"></script>
    <script src="/js/login.js" defer></script>
  </head>
  <body>
    <div class="auth">
      <div class="auth-band" aria-hidden="true"></div>

      <header class="auth-top">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </span>
          <span>Selección de Practicantes</span>
        </a>
        <div class="auth-top-right">
          <span class="tag">Acceso de analistas</span>
          <button type="button" class="theme-btn" data-theme-toggle>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span data-theme-label>Modo oscuro</span>
          </button>
        </div>
      </header>

      <main class="auth-card auth-card--narrow">
        <section class="auth-form">
          <p class="step">Panel de selección</p>
          <h1>Ingresa como analista</h1>
          <p class="sub">Usa tu usuario y contraseña para revisar las postulaciones.</p>

          <div id="login-alert" class="errbox" role="alert" hidden></div>

          <form id="login-form" class="form" novalidate>
            <div class="field">
              <label for="usuario">Usuario</label>
              <input class="input" id="usuario" name="usuario" type="text" autocomplete="username" maxlength="100"
                     autocapitalize="none" spellcheck="false" required aria-describedby="usuario-error" />
              <p class="err" id="usuario-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <div class="pass-wrap">
                <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                       maxlength="200" required aria-describedby="password-error" />
                <button type="button" class="pass-toggle" id="ver-password" aria-controls="password" aria-pressed="false">Mostrar</button>
              </div>
              <p class="err" id="password-error" aria-live="polite"></p>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn">
              <span class="spinner" id="login-spinner" aria-hidden="true" hidden></span>
              <span id="login-text">Ingresar</span>
            </button>
          </form>
        </section>

        <div class="auth-alt">
          <b>¿Eres practicante?</b>
          <span>Este acceso es solo para el equipo de selección. <a href="/">Registra tu postulación aquí.</a></span>
        </div>
      </main>
    </div>
  </body>
</html>
